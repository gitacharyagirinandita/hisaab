<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hisaab – Digital Udhar Khata</title>
  <meta name="description" content="Hisaab is a simple digital udhar khata (credit ledger) for Indian shop owners. Track credit, payments, balances and send WhatsApp reminders.">
  <meta name="theme-color" content="#0B7A47">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('hisaab:prefs:v1') || '{}');
        var t = p.theme === 'dark' || p.theme === 'light' ? p.theme
          : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        if (p.lang) document.documentElement.lang = p.lang;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="Hisaab home">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="currentColor"/>
        <path d="M14 13h20M14 20h20M24 20c0 7-4 9-10 9l12 9" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text"><b>Hisaab</b><small data-i18n="tagline">Digital Udhar Khata</small></span>
    </a>
    <div class="top-actions">
      <label class="sr-only" for="lang-select" data-i18n="language">Language</label>
      <select id="lang-select" class="lang-select">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="te">తెలుగు</option>
        <option value="kn">ಕನ್ನಡ</option>
      </select>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode"></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <noscript><p class="card">Hisaab needs JavaScript to run. Please enable it in your browser.</p></noscript>
  </main>

  <nav class="bottom-nav" aria-label="Main">
    <a href="#/" data-nav="home"><span class="nav-ico" data-icon="home"></span><span data-i18n="nav_home">Home</span></a>
    <button type="button" class="nav-add" data-action="add-customer" aria-label="Add customer"><span data-icon="plus"></span></button>
    <a href="#/settings" data-nav="settings"><span class="nav-ico" data-icon="settings"></span><span data-i18n="nav_settings">Settings</span></a>
  </nav>

  <div id="sheet-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
